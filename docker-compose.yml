services:
  # CodeIgniter 4 Website Builder application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ci4-website-builder-app
    restart: unless-stopped
    ports:
      - "${DOMAIN_HOST_PORT:-8190}:80"
    environment:
      - CI_ENVIRONMENT=${CI_ENVIRONMENT:-development}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8190}
      - app.baseURL=${APP_BASE_URL:-http://localhost:8190}
      - DB_HOST=db
      - DB_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ci4_website_builder_domain}
      - MYSQL_USER=${MYSQL_USER:-ci4_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ci4_domain_dev_password}
      - database.default.hostname=db
      - database.default.database=${MYSQL_DATABASE:-ci4_website_builder_domain}
      - database.default.username=${MYSQL_USER:-ci4_user}
      - database.default.password=${MYSQL_PASSWORD:-ci4_domain_dev_password}
      - database.default.DBDriver=MySQLi
      - database.default.port=3306
      - hub.url=${HUB_URL:-http://host.docker.internal:8180}
      - hub.appCode=${HUB_APP_CODE:-example-website-builder}
      - hub.apiKey=${HUB_API_KEY:-apk_local_development_only}
      - HUB_URL=${HUB_URL:-http://host.docker.internal:8180}
      - HUB_APP_CODE=${HUB_APP_CODE:-example-website-builder}
      - HUB_API_KEY=${HUB_API_KEY:-apk_local_development_only}
    volumes:
      # Mount writable directories for logs and cache
      - ./writable:/var/www/html/writable
      # Mount public directory for swagger.json updates
      - ./public/swagger.json:/var/www/html/public/swagger.json
    networks:
      - ci4-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  # MySQL database for the website builder
  db:
    image: mysql:8.0
    container_name: ci4-website-builder-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ci4_domain_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ci4_website_builder_domain}
      MYSQL_USER: ${MYSQL_USER:-ci4_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ci4_domain_dev_password}
    ports:
      - "${DOMAIN_DB_HOST_PORT:-3308}:3306"
    volumes:
      # Persist database data
      - mysql-data:/var/lib/mysql
    networks:
      - ci4-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin (optional, for database management)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ci4-website-builder-phpmyadmin
    restart: unless-stopped
    ports:
      - "${DOMAIN_PHPMYADMIN_HOST_PORT:-8087}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-ci4_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-ci4_domain_dev_password}
      UPLOAD_LIMIT: 50M
    networks:
      - ci4-network
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools

networks:
  ci4-network:
    driver: bridge
    name: ci4-domain-network

volumes:
  mysql-data:
    name: ci4-domain-mysql-data
